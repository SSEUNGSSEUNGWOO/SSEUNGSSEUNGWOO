<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="기획·운영 × 풀스택 개발">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/></pattern>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
  <rect x="48" y="48" width="528" height="184" rx="18" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="48" y="48" width="6" height="184" rx="3" fill="#34d399"/>
  <text x="80" y="90" font-size="15" fill="#34d399" font-family="'JetBrains Mono', Consolas, monospace" letter-spacing="3">PLANNING · OPERATIONS</text><text x="80" y="130" font-size="21" fill="#e2e8f0"><tspan font-weight="700" fill="#f8fafc">행안부 · NIA AI 챔피언 사업</tspan> 기획·운영</text><text x="80" y="168" font-size="21" fill="#e2e8f0"><tspan font-weight="700" fill="#f8fafc">선발 · 교육 · 인증평가</tspan> 전 주기 담당</text><text x="80" y="206" font-size="21" fill="#e2e8f0"><tspan font-weight="700" fill="#f8fafc">운영자 10명+</tspan> · 누적 기수 41개</text>
  <rect x="624" y="48" width="528" height="184" rx="18" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="624" y="48" width="6" height="184" rx="3" fill="#38bdf8"/>
  <text x="656" y="90" font-size="15" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" letter-spacing="3">FULL-STACK</text><text x="656" y="130" font-size="21" fill="#e2e8f0"><tspan font-weight="700" fill="#f8fafc">운영하면서 발견한 문제</tspan>를 직접 시스템으로</text><text x="656" y="168" font-size="21" fill="#e2e8f0"><tspan font-weight="700" fill="#f8fafc">웹(Next.js) · API(FastAPI) · DB(PostgreSQL)</tspan> · 클라우드 배포</text><text x="656" y="206" font-size="21" fill="#e2e8f0"><tspan font-weight="700" fill="#f8fafc">요구분석 · 설계 · 개발 · 운영</tspan> 전 단계 직접 수행</text>
  <circle cx="600" cy="140" r="22" fill="#0b1220" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="600" y="149" font-size="24" font-weight="700" fill="#f8fafc" text-anchor="middle">×</text></g>
</svg>
