<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Seungwoo Jang — 교육 운영의 요구사항을 분석하고, 업무 시스템을 개발·운영합니다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
    <text x="64" y="96" font-size="20" fill="#94a3b8" letter-spacing="4">SEUNGWOO JANG</text>
    <text x="64" y="160" font-size="46" font-weight="700" fill="#f8fafc">교육 운영의 요구사항을 분석하고,</text>
    <text x="64" y="216" font-size="46" font-weight="700" fill="#f8fafc">업무 시스템을 개발·운영합니다.</text>
    <text x="64" y="268" font-size="20" fill="#cbd5e1">공공 AI 교육 기획·운영 · 업무 시스템 4개 개발·운영 · 컴퓨터과학 전공</text>
  </g>

  <g transform="translate(860 64)">
    <rect x="0" y="0" width="276" height="192" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#e2e8f0">
      <text x="24" y="40"><tspan fill="#2dd4bf">기수</tspan>         41</text>
      <text x="24" y="76"><tspan fill="#2dd4bf">지원</tspan>      8,180</text>
      <text x="24" y="112"><tspan fill="#2dd4bf">수료</tspan>      1,449</text>
      <text x="24" y="148"><tspan fill="#2dd4bf">동시 응시</tspan>   108</text>
      <text x="24" y="178" font-size="12" fill="#64748b">2026년 운영 집계 · 이관 데이터 없음</text>
    </g>
  </g>
</svg>
