<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Seungwoo Jang — 기획·운영과 개발을 한 사람이">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
    <text x="64" y="96" font-size="20" fill="#94a3b8" letter-spacing="4">SEUNGWOO JANG</text>
    <text x="64" y="160" font-size="46" font-weight="700" fill="#f8fafc">기획·운영과 개발을</text>
    <text x="64" y="216" font-size="46" font-weight="700" fill="#f8fafc">한 사람이 직접 합니다.</text>
    <text x="64" y="268" font-size="20" fill="#cbd5e1">운영자로서 발견한 문제만 시스템으로 만든다 · 공공 AI 교육 · 1인 풀스택</text>
  </g>

  <g transform="translate(860 64)">
    <rect x="0" y="0" width="276" height="192" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#e2e8f0">
      <text x="24" y="40"><tspan fill="#34d399">기수</tspan>       41</text>
      <text x="24" y="76"><tspan fill="#34d399">지원</tspan>    8,180</text>
      <text x="24" y="112"><tspan fill="#34d399">수료</tspan>    1,449</text>
      <text x="24" y="148"><tspan fill="#38bdf8">CBT 제출</tspan>   783</text>
      <text x="24" y="178" font-size="12" fill="#64748b">kbrain-ems · kbrain-cert · 2026-09</text>
    </g>
  </g>
</svg>
