<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Agent Pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="24" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#fbbf24"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
    <text x="60" y="78" font-size="38" font-weight="700" fill="#f8fafc">Agent Pipeline</text>
    <text x="1140" y="76" font-size="20" fill="#fbbf24" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">python</text>
  </g>
  
  <g>
    <rect x="60" y="120" width="1080" height="500" rx="14" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="60" y="120" width="1080" height="34" rx="14" fill="#1e293b"/>
    <rect x="60" y="140" width="1080" height="14" fill="#1e293b"/>
    <circle cx="82" cy="137" r="5" fill="#f87171"/>
    <circle cx="100" cy="137" r="5" fill="#fbbf24"/>
    <circle cx="118" cy="137" r="5" fill="#34d399"/>
    <clipPath id="win"><rect x="60" y="154" width="1080" height="466" rx="0"/></clipPath>
    <g clip-path="url(#win)">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker>
      <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    </defs>
    <rect x="60" y="154" width="1080" height="466" fill="#0b1220"/>
    <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
      
      <rect x="120" y="224" width="170" height="96" rx="14" fill="#64748b" fill-opacity="0.2" stroke="#94a3b8" stroke-width="2"/>
      <text x="205.0" y="266.0" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">tasks.json</text>
      <text x="205.0" y="298.0" font-size="17" fill="#cbd5e1" text-anchor="middle">태스크 큐</text>
      <line x1="290" y1="272" x2="360" y2="272" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
      <rect x="370" y="184" width="560" height="380" rx="18" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="394" y="214" font-size="15" fill="#64748b" letter-spacing="2">STAGE 1 … N</text>
      
      <rect x="400" y="224" width="170" height="96" rx="14" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
      <text x="485.0" y="266.0" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">work</text>
      <text x="485.0" y="298.0" font-size="17" fill="#cbd5e1" text-anchor="middle">초안</text>
      <line x1="570" y1="272" x2="640" y2="272" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
      
      <rect x="650" y="224" width="170" height="96" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="2"/>
      <text x="735.0" y="266.0" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">critic</text>
      <text x="735.0" y="298.0" font-size="17" fill="#cbd5e1" text-anchor="middle">PASS / FAIL</text>
      
      <rect x="525" y="424" width="170" height="96" rx="14" fill="#ef4444" fill-opacity="0.2" stroke="#f87171" stroke-width="2"/>
      <text x="610.0" y="466.0" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">fix</text>
      <text x="610.0" y="498.0" font-size="17" fill="#cbd5e1" text-anchor="middle">피드백 반영</text>
      <path d="M735 320 L735 472 L705 472" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#ar)"/>
      <text x="750" y="404" font-size="16" fill="#f87171">FAIL</text>
      <path d="M525 472 L485 472 L485 330" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#ar)"/>
      <line x1="820" y1="272" x2="960" y2="272" stroke="#34d399" stroke-width="3" marker-end="url(#ag)"/>
      <text x="890" y="258" font-size="16" fill="#34d399" text-anchor="middle">PASS</text>
      
      <rect x="965" y="224" width="150" height="96" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
      <text x="1040.0" y="266.0" font-size="26" font-weight="700" fill="#f8fafc" text-anchor="middle">다음 단계</text>
      <text x="1040.0" y="298.0" font-size="17" fill="#cbd5e1" text-anchor="middle">$prev</text>
      <text x="600.0" y="599" font-size="17" fill="#94a3b8" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">매 호출 = 새 claude -p 세션 · 단계 output 캐시 · 도메인은 프롬프트 md에만</text>
    </g></g>
    <rect x="60" y="120" width="1080" height="500" rx="14" fill="none" stroke="#fbbf24" stroke-opacity="0.35"/>
  </g>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
    <text x="60" y="702" font-size="40" font-weight="700" fill="#fbbf24" font-family="'JetBrains Mono', Consolas, monospace">PASS</text>
    <text x="182" y="702" font-size="20" fill="#94a3b8">까지 다음 단계로 못 간다</text>
    <text x="1140" y="702" font-size="20" fill="#cbd5e1" text-anchor="end">Critic PASS까지 도는 오케스트레이터</text>
  </g>
