<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Seungwoo Jang — 현업 요구사항을 분석하고, AI · 업무 시스템으로 바꿉니다">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0f172a" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#e2e8f0"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif">
    <text x="64" y="96" font-size="20" fill="#64748b" letter-spacing="4">SEUNGWOO JANG</text>
    <text x="64" y="160" font-size="46" font-weight="700" fill="#0f172a">현업 요구사항을 분석하고,</text>
    <text x="64" y="216" font-size="46" font-weight="700" fill="#0f172a">AI · 업무 시스템으로 바꿉니다.</text>
    <text x="64" y="268" font-size="19" fill="#475569">교육 · 공공조달 · 영업 3개 도메인 · 운영 중 시스템 6개 · 컴퓨터과학 전공</text>
  </g>

  <g transform="translate(860 64)">
    <rect x="0" y="0" width="276" height="192" rx="14" fill="#0f172a"/>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="15" fill="#e2e8f0">
      <text x="24" y="40"><tspan fill="#2dd4bf">공고</tspan>    11,000+</text>
      <text x="24" y="76"><tspan fill="#2dd4bf">지원</tspan>      8,180</text>
      <text x="24" y="112"><tspan fill="#2dd4bf">수료</tspan>      1,449</text>
      <text x="24" y="148"><tspan fill="#2dd4bf">동시 응시</tspan>   108</text>
      <text x="24" y="178" font-size="12" fill="#94a3b8">조달핏 · kbrain-ems · kbrain-cert 운영 집계</text>
    </g>
  </g>
</svg>
